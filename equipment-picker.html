<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111827; color: #f3f4f6; }
    </style>
</head>
<body class="p-6 md:p-12 font-sans">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-2">Equipment Setup</h1>
        <p class="text-gray-400 mb-8">Select the machines and equipment available to you. Remember to stick to machines where possible for joint stability.</p>
        
        <div id="equipment-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <!-- Toggles will be injected here -->
        </div>

        <button onclick="generatePrompt()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded">
            Generate Claude List
        </button>

        <div id="result-container" class="mt-6 hidden">
            <h2 class="text-xl font-semibold mb-2">Copy this for your prompt:</h2>
            <textarea id="output-text" class="w-full bg-gray-800 text-green-400 p-4 rounded h-32" readonly></textarea>
        </div>
    </div>

    <script>
        let availableEquipment = [];

        // Load the local JSON file
        fetch('exercises.json')
            .then(response => response.json())
            .then(data => {
                // Extract unique equipment types
                const equipmentSet = new Set(data.map(ex => ex.equipment));
                availableEquipment = Array.from(equipmentSet).sort();
                renderToggles();
            })
            .catch(err => console.error("Error loading exercises.json. Make sure you are running a local server.", err));

        function renderToggles() {
            const container = document.getElementById('equipment-list');
            availableEquipment.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center p-4 bg-gray-800 rounded-lg border border-gray-700";
                div.innerHTML = `
                    <input type="checkbox" id="${item}" value="${item}" class="w-5 h-5 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-500">
                    <label for="${item}" class="ml-3 text-lg font-medium capitalize cursor-pointer w-full">${item}</label>
                `;
                container.appendChild(div);
            });
        }

        function generatePrompt() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            const selected = Array.from(checkboxes).map(cb => cb.value);
            
            const resultContainer = document.getElementById('result-container');
            const outputText = document.getElementById('output-text');
            
            if(selected.length === 0) {
                alert("Please select at least one piece of equipment.");
                return;
            }

            outputText.value = selected.join(', ');
            resultContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
