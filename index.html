<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Gym Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#000;--s1:#0d0d10;--s2:#16161a;--s3:#212127;--line:#2c2c34;--tx:#f6f6f8;--mut:#a3a3ae;--acc:#c8f526;--acc-tx:#0b1100;--ok:#22c55e;--warn:#facc15;--bad:#ef4444;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 calc(84px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:21px;line-height:1.2;margin:0}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px;color:var(--mut);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
p{margin:0 0 8px}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 0}
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.01em}
.brand b{color:var(--acc)}
.datep{color:var(--mut);font-size:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.flat{padding:0;overflow:hidden}
.sub{color:var(--mut);font-size:14px}
.mut{color:var(--mut)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--s3);color:var(--tx);border-radius:14px;min-height:52px;padding:0 16px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:scale(.98);filter:brightness(1.15)}
.btn.primary{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.danger{background:#2a0d0d;border-color:#5b1a1a;color:#ff9a9a}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;min-height:52px;padding:0 12px;width:100%;outline:none}
textarea{padding:10px 12px;min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label.f{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:58px;min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1;cursor:pointer}
.chip small{font-weight:600;color:var(--mut);font-size:11px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
.chip.on small{color:#2b3a00}
.chip.done::after{content:"✓";font-size:12px;color:var(--ok)}
.chip.on.done::after{color:var(--acc-tx)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;border:1px solid var(--line);background:var(--s2);padding:3px 10px;font-size:12.5px;color:var(--mut);margin:0 6px 6px 0}
.tag.up{color:#0b1100;background:var(--acc);border-color:var(--acc);font-weight:800}
.bar{height:8px;border-radius:99px;background:var(--s3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.bar.ok>i{background:var(--ok)}
.exh{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;min-height:76px}
.thumb{width:56px;height:56px;border-radius:12px;background:#fff;object-fit:cover;flex:0 0 auto}
.exn{font-weight:800;font-size:16px;line-height:1.2}
.exs{color:var(--mut);font-size:13px;margin-top:2px}
.prog{font-weight:800;font-size:15px;min-width:44px;text-align:right;color:var(--mut)}
.prog.full{color:var(--ok)}
.exb{padding:0 12px 14px;border-top:1px solid var(--line)}
.media{display:flex;gap:12px;align-items:center;padding:12px 0}
.mwrap{width:180px;height:180px;border-radius:14px;overflow:hidden;background:#fff;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#444;font-size:13px;text-align:center}
.mwrap img{width:100%;height:100%;object-fit:cover;display:block}
.mside{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.note{border-left:3px solid var(--warn);background:#1c1805;color:#f4e08a;border-radius:8px;padding:8px 10px;font-size:13.5px;margin:0 0 10px}
.set{border:1px solid var(--line);background:var(--s2);border-radius:14px;padding:10px;margin:0 0 8px}
.set.logged{background:#0b1a0f;border-color:#1b4a2a}
.seth{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px}
.seth b{font-size:15px}
.prev{color:var(--mut);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setin{display:flex;gap:8px;align-items:stretch}
.stepper{display:flex;align-items:stretch;flex:1.55;min-width:0}
.stepper button{all:unset;box-sizing:border-box;width:46px;flex:0 0 46px;min-height:52px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;background:var(--s3);border:1px solid var(--line);cursor:pointer;user-select:none}
.stepper button:first-child{border-radius:12px 0 0 12px;border-right:0}
.stepper button:last-child{border-radius:0 12px 12px 0;border-left:0}
.stepper input{border-radius:0;text-align:center;font-size:20px;font-weight:800;padding:0 2px;min-width:0}
.setin .reps{flex:1;min-width:0;text-align:center;font-size:20px;font-weight:800;padding:0 4px}
.setin .fin{flex:1.1;min-width:84px;padding:0 8px}
.setin.two .reps{flex:.8}
.sidelab{font-size:11px;color:var(--mut);text-align:center;display:block;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px}
.badge.ok{background:#0d2a17;color:#6df09a;border:1px solid #1d5a33}
.badge.warn{background:#2b2606;color:#ffe066;border:1px solid #5c5112}
.badge.bad{background:#2d0d0d;color:#ff8a8a;border:1px solid #6b1d1d}
.badge.none{background:var(--s2);color:var(--mut);border:1px solid var(--line)}
.big{font-size:30px;font-weight:800;line-height:1.1}
details{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";margin-right:8px;color:var(--acc)}
details[open] summary::before{content:"▾"}
ol.steps{margin:4px 0 6px 0;padding-left:22px;color:#dcdce2}
ol.steps li{margin:0 0 7px}
.meal{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer;min-height:72px}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:transparent;flex:0 0 44px}
.on>.chk,.chk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
.ing{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:4px}
.ing td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.ing td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:10px}
.ing em{display:block;font-style:normal;color:var(--mut);font-size:12px}
.glasses{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:10px 0}
.glasses i{height:22px;border-radius:5px;background:var(--s3)}
.glasses i.on{background:#38bdf8}
.tgl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:60px}
.sw{width:54px;height:32px;border-radius:99px;background:var(--s3);border:1px solid var(--line);position:relative;flex:0 0 54px;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:.15s}
.sw.on{background:var(--acc);border-color:var(--acc)}
.sw.on::after{left:25px;background:var(--acc-tx)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t td,table.t th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
table.t th{color:var(--mut);font-weight:600;font-size:12px;border-top:0}
table.t td:last-child,table.t th:last-child{text-align:right}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,8,10,.97);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{all:unset;box-sizing:border-box;flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;border-radius:12px}
.nav button span{font-size:22px;line-height:1}
.nav button.on{color:var(--acc)}
.rest{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;background:#10150a;border:2px solid var(--acc);border-radius:18px;padding:10px 12px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.7)}
.rest.show{display:block}
.rest .rt{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.rest .row{gap:8px}
.rest .row>div:first-child{flex:1;min-width:0}
body.resting{padding-bottom:calc(176px + env(safe-area-inset-bottom))}
.rest .rl{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest.fin{background:var(--acc);color:var(--acc-tx)}
.rest.fin .rl{color:#2b3a00}
.rest .btn{min-height:48px;padding:0 10px;font-size:14px;flex:0 0 auto;min-width:54px}
.rest .bar{margin-top:8px;background:#26301a}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:70;background:#f6f6f8;color:#111;padding:12px 16px;border-radius:12px;font-weight:700;max-width:90vw;text-align:center;display:none}
.toast.show{display:block}
.empty{color:var(--mut);text-align:center;padding:18px 8px}
.foot{color:#6f6f7a;font-size:12px;text-align:center;padding:10px 0 4px}
.foot a{color:#8f8fa0}
@media (max-width:380px){.mwrap{width:150px;height:150px}.stepper button{width:40px;flex-basis:40px}}
@media (max-width:340px){.media{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="top"><div class="in"><div class="brand">GYM <b>COMPANION</b></div><div class="datep" id="datep"></div></div></div>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="rest" id="rest" role="timer">
  <div class="row"><div><div class="rl" id="rlabel">Rest</div><div class="rt" id="rtime">0:00</div></div>
  <button class="btn sm" data-act="rest-adj" data-s="-15">−15s</button><button class="btn sm" data-act="rest-adj" data-s="15">+15s</button><button class="btn sm primary" data-act="rest-skip">Skip</button></div>
  <div class="bar"><i id="rbar" style="width:100%"></i></div>
</div>
<nav class="nav" id="nav">
  <button data-tab="workout"><span>🏋️</span>Workout</button>
  <button data-tab="weight"><span><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block"><rect x="2.5" y="2.5" width="19" height="19" rx="4.5" fill="#e5e7eb"/><rect x="6" y="5" width="12" height="5.6" rx="1.5" fill="#0b0f06"/><rect x="7.4" y="6.7" width="2.4" height="2.2" rx=".5" fill="#c8f526"/><rect x="10.8" y="6.7" width="2.4" height="2.2" rx=".5" fill="#c8f526"/><rect x="14.2" y="6.7" width="2.4" height="2.2" rx=".5" fill="#c8f526"/><rect x="6" y="13" width="5.2" height="6" rx="1.7" fill="#9ca3af"/><rect x="12.8" y="13" width="5.2" height="6" rx="1.7" fill="#9ca3af"/></svg></span>Weight</button>
  <button data-tab="food"><span>🍽️</span>Food</button>
  <button data-tab="data"><span>⚙️</span>Data</button>
</nav>
<div class="toast" id="toast"></div>
<div id="modal"></div>

lls back to the starting position.","Repeat for the recommended amount of repetitions."]},"2611":{"n":"lever horizontal one leg press","eq":"leverage machine","img":"images/2611-9KU9TYF.jpg","gif":"videos/2611-9KU9TYF.gif","steps":["Adjust the seat of the machine so that your knees are at a 90-degree angle when your feet are on the footplate.","Sit on the machine with your back against the backrest and your feet shoulder-width apart on the footplate.","Place your hands on the handles or sides of the machine for stability.","Push the footplate away from your body by extending your leg, keeping your back against the backrest.","Pause for a moment at the fully extended position, then slowly bend your leg to return to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},"2287":{"n":"lever alternate leg press","eq":"leverage machine","img":"images/2287-V07qpXy.jpg","gif":"videos/2287-V07qpXy.gif","steps":["Adjust the seat and foot platform of the leverage machine to your desired position.","Sit on the machine with your back against the backrest and your feet on the foot platform.","Place your hands on the handles or sides of the machine for stability.","Push one foot against the foot platform, extending your leg until it is almost fully straight.","Pause for a moment, then slowly bend your leg and return to the starting position.","Repeat with the other leg.","Continue alternating legs for the desired number of repetitions."]},"0585":{"n":"lever leg extension","eq":"leverage machine","img":"images/0585-my33uHU.jpg","gif":"videos/0585-my33uHU.gif","steps":["Adjust the seat height and backrest of the machine to fit your body.","Sit on the machine with your back against the backrest and your feet on the footpad.","Grasp the handles or sidebars for stability.","Extend your legs forward by straightening your knees, lifting the weight.","Pause for a moment at the top, then slowly lower the weight back to the starting position.","Repeat fo const idb=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('gym-companion',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const idbGet=async k=>{const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbSet=async(k,v)=>{const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};

/* ---------- routine ---------- */
const R=()=>S.routine&&S.routine.length?S.routine:ROUTINE;
let _dc=null,_dr=null;
function days(){
  const r=R();if(_dr===r&&_dc)return _dc;
  const m=new Map();
  r.forEach(e=>{if(!m.has(e.day))m.set(e.day,{day:e.day,name:e.day_name,ex:[]});m.get(e.day).ex.push(e)});
  _dc=[...m.values()].sort((a,b)=>a.day-b.day);_dc.forEach(d=>d.ex.sort((a,b)=>a.order-b.order));_dr=r;return _dc;
}
const dayObj=n=>days().find(d=>d.day===n)||days()[0];
const exOf=(day,id)=>dayObj(day).ex.find(e=>e.id===id);
const info=e=>{const i=EX[e.id]||{};return{img:e.image||i.img||'',gif:e.gif_url||i.gif||'',steps:(e.instruction_steps&&e.instruction_steps.en)||i.steps||[]}};
const kindOf=e=>{const s=String(e.reps);if(/min/i.test(s))return'cardio';if(/sec/i.test(s))return'hold';if(/\/\s*(side|leg)/i.test(s))return'side';return'lift'};
const topReps=s=>{const m=String(s).match(/(\d+)(?:\s*-\s*(\d+))?/);return m?+(m[2]||m[1]):0};
const lowReps=s=>{const m=String(s).match(/(\d+)/);return m?+m[1]:0};
const nSets=e=>kindOf(e)==='cardio'?1:(S.settings.deload?Math.min(2,e.sets):e.sets);
const rpeOf=e=>(S.settings.deload&&kindOf(e)!=='cardio')?6:e.rpe;

}

/* ---------- sessions ---------- */
const skey=(date,day)=>date+'|'+day;
function sess(day,create,date=dkey()){
  const k=skey(date,day);let s=S.sessions[k];
  if(!s&&create)s=S.sessions[k]={date,day,sets:{},done:false};
  return s;
}
const getSet=(day,id,i)=>{const s=sess(day);return(s&&s.sets[id]&&s.sets[id][i])||null};
function putSet(day,id,i,rec){
  const s=sess(day,true);const a=s.sets[id]||(s.sets[id]=[]);
  while(a.length<i)a.push(null);a[i]=rec;
}
function prevSets(day,id){
  const cur=skey(dkey(),day);
  const ks=Object.keys(S.sessions).filter(k=>k!==cur&&S.sessions[k].day===day&&(S.sessions[k].sets[id]||[]).some(Boolean)).sort().reverse();
  return ks.length?{date:S.sessions[ks[0]].date,sets:S.sessions[ks[0]].sets[id]}:null;
}
function progress(d){
  let done=0,total=0;
  d.ex.forEach(e=>{const n=nSets(e);total+=n;for(let i=0;i<n;i++)if(getSet(d.day,e.id,i))done++});
  return{done,total};
}
function firstIncomplete(d){
  for(const e of d.ex){const n=nSets(e);for(let i=0;i<n;i++)if(!getSet(d.day,e.id,i))return e.id}
  return null;
}
function suggestedDay(){
  const D=days();const max=D[D.length-1].day;const today=dkey();
  const t=Object.values(S.sessions).filter(s=>s.date===today&&!s.done&&Object.values(s.sets).some(a=>a.some(Boolean)));
  if(t.length)return t[0].day;
  const ds=Object.values(S.sessions).filter(s=>s.done).sort((a,b)=>(a.date+String(a.t||0)).localeCompare(b.date+String(b.t||0)));
  if(ds.length){const last=ds[ds.length-1].day;const nxt=D.find(d=>d.day>last);return nxt?nxt.day:D[0].day}
  return D[0].day;
}
const doneRecently=day=>{const t=didx(dkey());return Object.values(S.sessions).some(s=>s.day===day&&s.done&&t-didx(s.date)<7)};
function readyToIncrease(e,day){
  const k=kindOf(e);if(k==='cardio'||k==='hold'||S.settings.deload)return false;
  const p=prevSets(day,e.id);if(!p)return false;
  const logs=p.sets.filter(Boolean);if(logs.length<e.sets)return false;
  const top=topReps(e.reps);
  return logs.every(l=>Math.min(l.r||0,l.r2==null?1e9:l.r2)>=top);
}
function weekNo(){
  const ds=Object.values(S.sessions).map(s=>s.date).sort();if(!ds.length)return 1;
  return Math.floor((didx(dkey())-didx(ds[0]))/7)+1;
}

function vWorkout(){
  const D=days();const dd=dayObj(UI.day);UI.day=dd.day;
  const P=progress(dd);const pct=P.total?Math.round(P.done/P.total*100):0;
  const sug=suggestedDay();
  let h='';
  const wk=weekNo();
  if(wk>=5&&wk%5===0&&!S.settings.deload)h+=`<div class="note">Week ${wk}: your plan calls for a deload week (2 sets, RPE 6). Turn it on in Data → Settings.</div>`;
  if(S.settings.deload)h+=`<div class="note">Deload week is ON — 2 sets per exercise at RPE 6.</div>`;
  if('Notification' in window&&Notification.permission==='default'&&!S.settings.notifyAsked)
    h+=`<div class="card"><div class="row"><div class="sp"><b>Rest-timer alerts</b><div class="sub">Get a notification (and a buzz on your watch) when rest ends.</div></div><button class="btn sm primary" data-act="notif-enable">Enable</button></div></div>`;
  h+=`<div class="chips">${D.map(d=>`<button class="chip ${d.day===UI.day?'on':''} ${doneRecently(d.day)?'done':''}" data-act="day" data-day="${d.day}"><small>DAY</small>${d.day}</button>`).join('')}</div>`;
  h+=`<div class="card"><h1>${esc(dd.name)}</h1><div class="sub" style="margin:4px 0 10px">${P.done}/${P.total} sets${UI.day===sug?' · <b style="color:var(--acc)">Up next</b>':` · <button class="btn sm ghost" style="min-height:34px;padding:0 10px" data-act="day" data-day="${sug}">Go to Day ${sug}</button>`}</div><div class="bar ${pct===100?'ok':''}"><i style="width:${pct}%"></i></div></div>`;
  const fi=firstIncomplete(dd);
  h+=dd.ex.map((e,i)=>vEx(e,i,dd,fi)).join('');
  const s=sess(dd.day);
  if(P.done>0&&!(s&&s.done))h+=`<button class="btn block" data-act="finish-workout">Finish workout early</button>`;
  if(s&&s.done)h+=`<div class="card" style="border-color:#1d5a33"><b style="color:var(--ok)">✓ Workout complete.</b><div class="sub">Next up: Day ${suggestedDay()}.</div></div>`;
  return h;
}
function prevStr(kind,l){

  return`${l.r} min${l.w!=null?' · lvl '+l.w:''}`;
}
function logStr(kind,l){

function draftFor(day,e,i){
  const k=day+':'+e.id+':'+i;if(UI.draft[k])return UI.draft[k];
  const cur=(sess(day)||{sets:{}}).sets[e.id]||[];let w='';

const fld=(f,val,ph,lab,mode='numeric')=>`<div style="flex:1;min-width:0"><input class="reps" data-f="${f}" inputmode="${mode}" placeholder="${esc(ph)}" value="${esc(val)}">${lab?`<span class="sidelab">${lab}</span>`:''}</div>`;
function vSet(day,e,i,kind){

function vEx(e,idx,dd,fi){

/* ---------- WEIGHT view ---------- */
const sortedW=()=>S.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));
function avgWin(endIdx){
  const xs=S.weights.filter(w=>{const i=didx(w.date);return i<=endIdx&&i>=endIdx-6});
  return xs.length?{avg:xs.reduce((a,b)=>a+b.kg,0)/xs.length,n:xs.length}:null;
}
function pace(){
  const t=didx(dkey());const cur=avgWin(t),prev=avgWin(t-7),older=avgWin(t-14);
  if(!cur||!prev)return{state:'none',cur,prev};
  const loss=r2(prev.avg-cur.avg);
  let state=loss>1.0?'bad':(loss>=0.4?'ok':'warn');
  const prevLoss=older?r2(older.avg-prev.avg):null;
  return{state,loss,cur,prev,twice:state==='bad'&&prevLoss!=null&&prevLoss>1.0,lowData:cur.n<3||prev.n<3};
}
function lastDose(){return S.doses.slice().sort((a,b)=>(a.date+(a.t||0)).localeCompare(b.date+(b.t||0))).pop()||null}
function nextSite(){const l=lastDose();if(!l)return SITES[0];const i=SITES.indexOf(l.site);return SITES[(i+1)%SITES.length]}
const tuesdayPending=()=>new Date().getDay()===2&&!S.doses.some(d=>d.date===dkey());
function chartSvg(){
  const t=didx(dkey());const pts=sortedW().filter(w=>didx(w.date)>=t-55);
  if(pts.length<2)return'<div class="empty">Log at least two weigh-ins to see your trend.</div>';
  const W=340,H=150,pl=30,pr=8,pt=10,pb=22;
  const xs=pts.map(p=>didx(p.date));const ma=pts.map(p=>{const i=didx(p.date);const a=S.weights.filter(w=>{const j=didx(w.date);return j<=i&&j>=i-6});return a.reduce((s,w)=>s+w.kg,0)/a.length});
  const all=pts.map(p=>p.kg).concat(ma);let mn=Math.min(...all),mx=Math.max(...all);if(mx-mn<2){const c=(mx+mn)/2;mn=c-1;mx=c+1}
  mn=Math.floor(mn-.3);mx=Math.ceil(mx+.3);
  const x0=Math.min(...xs),x1=Math.max(...xs,x0+1);
  const X=i=>pl+(i-x0)/(x1-x0)*(W-pl-pr),Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const line=ma.map((v,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const grid=[mn,(mn+mx)/2,mx].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2c2c34" stroke-width="1"/><text x="${pl-4}" y="${Y(v)+4}" fill="#a3a3ae" font-size="10" text-anchor="end">${r1(v)}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="3" fill="#a3a3ae"/>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight trend, last 8 weeks">${grid}${dots}<path d="${line}" fill="none" stroke="#c8f526" stroke-width="2.5" stroke-linejoin="round"/><text x="${pl}" y="${H-5}" fill="#a3a3ae" font-size="10">${fdate(pts[0].date)}</text><text x="${W-pr}" y="${H-5}" fill="#a3a3ae" font-size="10" text-anchor="end">${fdate(pts[pts.length-1].date)}</text></svg><div class="small mut" style="display:flex;gap:14px"><span><b style="color:#a3a3ae">●</b> daily</span><span><b style="color:var(--acc)">━</b> 7-day average</span></div>`;
}
function vWeight(){
  const p=pace();const today=dkey();const tw=S.weights.find(w=>w.date===today);
  let h='';
  if(tuesdayPending())h+=`<div class="card" style="border-color:var(--acc)"><h2>💉 Injection day</h2><p>Weigh in first, then take your weekly dose.</p><button class="btn primary block" data-act="dose-open">Log weight &amp; dose</button></div>`;
  let badge='',msg='';

  if(p.cur&&p.prev)h+=`<div class="grid2" style="margin-bottom:10px"><div><div class="sub">This week avg</div><div class="big">${r1(p.cur.avg).toFixed(1)}<small style="font-size:14px"> kg</small></div><div class="small mut">${p.cur.n} weigh-in${p.cur.n>1?'s':''}</div></div><div><div class="sub">Last week avg</div><div class="big">${r1(p.prev.avg).toFixed(1)}<small style="font-size:14px"> kg</small></div><div class="small mut">${p.prev.n} weigh-in${p.prev.n>1?'s':''}</div></div></div>`;
  h+=`<p class="sub">${esc(msg)}</p>${p.lowData?'<p class="small" style="color:var(--warn)">Few weigh-ins in one of the weeks — treat this badge as a rough guide.</p>':''}</div>`;
  h+=`<div class="card"><h3>Weigh-in</h3><div class="row"><input id="wq" inputmode="decimal" placeholder="Today's weight (kg)" value="${tw?tw.kg:''}" aria-label="Weight in kg"><button class="btn primary" data-act="w-save" style="flex:0 0 auto">Save</button></div><div class="small mut" style="margin-top:6px">${tw?'Logged today: '+tw.kg+' kg (saving again replaces it).':'Weigh at the same time each day, before eating.'}</div></div>`;
  h+=`<div class="card"><h3>Trend · 8 weeks</h3>${chartSvg()}</div>`;
  const t=didx(dkey());const rows=[];
  for(let k=0;k<6;k++){const a=avgWin(t-7*k);if(a){const b=avgWin(t-7*(k+1));rows.push({end:t-7*k,a,loss:b?r2(b.avg-a.avg):null})}}
  if(rows.length){h+=`<div class="card"><h3>Weekly averages</h3><table class="t"><tr><th>Week ending</th><th>Avg</th><th>Change</th></tr>${rows.map(r=>{const d=new Date(r.end*864e5);const k=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;return`<tr><td>${fdate(k)}</td><td>${r1(r.a.avg).toFixed(1)} kg</td><td>${r.loss==null?'—':(r.loss>0?'−':'+')+Math.abs(r.loss).toFixed(2)}</td></tr>`}).join('')}</table></div>`}
  const ld=lastDose();const ds=S.doses.slice().sort((a,b)=>(b.date+(b.t||0)).localeCompare(a.date+(a.t||0))).slice(0,12);
  h+=`<div class="card"><h3>Ozempic log</h3>${ld?`<p class="sub">Last dose: <b style="color:var(--tx)">${fdateL(ld.date)}</b> · ${ld.mg} mg · ${esc(ld.site)}<br>Next site in rotation: ${esc(nextSite())}</p>`:'<p class="sub">No doses logged yet.</p>'}`;
  if(ds.length)h+=`<table class="t"><tr><th>Date</th><th>Dose</th><th>Site</th><th></th></tr>${ds.map(d=>`<tr><td>${fdate(d.date)}</td><td>${d.mg} mg</td><td>${esc(d.site)}</td><td><button class="btn sm ghost" style="min-height:36px" data-act="dose-del" data-t="${d.t}" aria-label="Delete entry">✕</button></td></tr>`).join('')}</table>`;
  h+=`<button class="btn block" style="margin-top:10px" data-act="dose-open">Log weight &amp; dose</button></div>`;
  const ws=sortedW().slice(-10).reverse();
  if(ws.length)h+=`<div class="card"><h3>Recent weigh-ins</h3><table class="t">${ws.map(w=>`<tr><td>${fdateL(w.date)}</td><td>${w.kg} kg</td><td><button class="btn sm ghost" style="min-height:36px" data-act="w-del" data-date="${w.date}" aria-label="Delete weigh-in">✕</button></td></tr>`).join('')}</table></div>`;
  return h;
}
function openDoseModal(){

function saveDose(){
  const today=dkey();const kg=num($('#dw').value);const mg=num($('#dm').value);const site=$('#ds').value;
  const hasW=S.weights.some(w=>w.date===today);
  if(kg==null&&!hasW){toast('Enter your weight first (before injecting).');$('#dw').focus();return}

  $('#datep').textContent=fdateL(dkey());
  $('#view').innerHTML=(VIEWS[UI.tab]||vWorkout)();
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  if(UI.tab==='data')storageInfo();
}
async function storageInfo(){
  try{const el=$('#storinfo');if(!el||!navigator.storage)return;const e=await navigator.storage.estimate();const p=navigator.storage.persisted?await navigator.storage.persisted():false;
    const e2=$('#storinfo');if(e2)e2.textContent=`Storage: ${(e.usage/1048576).toFixed(1)} MB used · persistent: ${p?'yes':'no'}`}catch(x){}
}

/* ---------- rest timer ---------- */
const T={end:0,total:0,label:'',iv:null,fired:false};
let ac=null,wl=null,wakeWanted=false;
function unlockAudio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){
  if(!S.settings.sound||!ac)return;
  try{const t0=ac.currentTime;[0,.28,.56].forEach((o,i)=>{const os=ac.createOscillator(),g=ac.createGain();os.type='sine';os.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(.5,t0+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+o+.22);os.connect(g);g.connect(ac.destination);os.start(t0+o);os.stop(t0+o+.25)})}catch(e){}
}
const buzz=p=>{if(S.settings.vibrate&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
async function notifyRest(label){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const opts={body:label?'Next: '+label:'Start your next set',tag:'gc-rest',renotify:true,vibrate:[250,100,250,100,250],icon:'icons/icon-192.png',badge:'icons/icon-192.png'};
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification('Rest over — go!',opts);return}}catch(e){}
  try{new Notification('Rest over — go!',opts)}catch(e){}
}
function persistRest(){lsSet('gc.rest',JSON.stringify({end:T.end,total:T.total,label:T.label}))}
function startRest(sec,label){
  T.total=sec;T.end=Date.now()+sec*1000;T.label=label;T.fired=false;persistRest();
  clearInterval(T.iv);T.iv=setInterval(tick,250);$('#rest').classList.remove('fin');$('#rest').classList.add('show');document.body.classList.add('resting');tick();
}
function stopRest(){clearInterval(T.iv);T.iv=null;T.fired=true;$('#rest').classList.remove('show','fin');document.body.classList.remove('resting');try{localStorage.removeItem('gc.rest')}catch(e){}}
function tick(){
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  $('#rtime').textContent=fmtT(left);$('#rlabel').textContent=left>0?'Rest · next: '+(T.label||'next set'):'Go! Start your next set';
  $('#rbar').style.width=(T.total?Math.max(0,Math.min(100,left/T.total*100)):0)+'%';
  if(left<=0&&!T.fired){
    T.fired=true;clearInterval(T.iv);$('#rest').classList.add('fin');beep();buzz([300,120,300,120,500]);notifyRest(T.label);
    try{localStorage.removeItem('gc.rest')}catch(e){}
    setTimeout(()=>{if(T.fired&&$('#rest').classList.contains('fin'))stopRest()},6000);
  }
}
function adjRest(s){
  if(T.fired){return}
  T.end+=s*1000;T.total=Math.max(1,T.total+s);persistRest();tick();
}
function restoreRest(){
  try{const o=JSON.parse(lsGet('gc.rest')||'null');if(o&&o.end>Date.now()){T.end=o.end;T.total=o.total;T.label=o.label;T.fired=false;clearInterval(T.iv);T.iv=setInterval(tick,250);$('#rest').classList.add('show');document.body.classList.add('resting');tick()}}catch(e){}
}
async function wake(){
  if(!S.settings.wake||!wakeWanted||!('wakeLock' in navigator))return;
  try{if(!wl||wl.released)wl=await navigator.wakeLock.request('screen')}catch(e){}
}

/* ---------- set actions ---------- */
function finishSet(btn){
  const id=btn.dataset.id,i=+btn.dataset.i,day=UI.day;const e=exOf(day,id);if(!e)return;
  const kind=kindOf(e);const row=btn.closest('.set');
  const g=f=>{const el=row.querySelector(`[data-f="${f}"]`);return el?num(el.value):null};
  const w=g('w'),a=g('r'),b=g('r2');
  const two=kind==='side'||kind==='hold';
  if(!(a>0)||(two&&!(b>0))){toast(two?'Enter reps/seconds for both sides':kind==='cardio'?'Enter the minutes':'Enter the reps you completed');const el=row.querySelector('[data-f="r"]');if(el)el.focus();return}
  if(w!=null&&(w<0||w>1000)){toast('Check the weight');return}
  unlockAudio();wakeWanted=true;wake();buzz(25);
  putSet(day,id,i,{w:w,r:a,r2:two?b:null,t:Date.now()});
  delete UI.draft[day+':'+id+':'+i];
  const dd=dayObj(day);const P=progress(dd);const s=sess(day,true);
  const key=day+':'+id;const n=nSets(e);let cnt=0;for(let j=0;j<n;j++)if(getSet(day,id,j))cnt++;
  let scrollTo=null;
  if(cnt>=n){UI.open[key]=false;const nx=firstIncomplete(dd);if(nx){UI.open[day+':'+nx]=true;scrollTo=day+'-'+nx}}
  if(P.done>=P.total&&!s.done){s.done=true;s.t=Date.now();toast('Workout complete — nice work 💪',3500);stopRest()}
  else if(kind!=='cardio'&&e.rest_seconds>0){
    const nxe=cnt>=n?(()=>{const x=firstIncomplete(dd);return x?title(exOf(day,x).name):''})():title(e.name);
    startRest(e.rest_seconds,nxe);
  }
  save();render();
  if(scrollTo){const el=document.getElementById('ex-'+scrollTo);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
}

/* ---------- ICS ---------- */
function makeICS(){
  const [hh,mm]=(S.settings.remindTime||'07:00').split(':').map(Number);
  const d=new Date();d.setHours(hh,mm,0,0);while(d.getDay()!==2||d<new Date())d.setDate(d.getDate()+1);
  const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const e=new Date(d.getTime()+15*60000);const now=new Date();
  const stamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gym Companion//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:gym-companion-tuesday@gabo53.github.io','DTSTAMP:'+stamp,'DTSTART:'+f(d),'DTEND:'+f(e),'RRULE:FREQ=WEEKLY;BYDAY=TU','SUMMARY:Weigh in, then Ozempic dose','DESCRIPTION:Log body weight BEFORE the weekly injection. Open Gym Companion to record both.','BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:Weigh in, then Ozempic dose','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function download(name,text,type){
  const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function pickFile(cb){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(String(r.result));r.onerror=()=>toast('Could not read that file');r.readAsText(f)};i.click();
}
async function cacheMedia(kind){
  if(!('caches' in window)){toast('Caching is not supported here');return}
  const ids=[...new Set(R().map(e=>e.id))];const urls=[];
  R().forEach(e=>{const m=info(e);const p=kind==='gif'?m.gif:m.img;const u=imgUrl(p);if(u&&!urls.includes(u))urls.push(u)});
  const c=await caches.open('gc-media-v1');let ok=0,fail=0;
  const set=()=>{UI.cacheMsg=`Cached ${ok}/${urls.length}${fail?` · ${fail} failed`:''}…`;const el=$('#cachemsg');if(el)el.textContent=UI.cacheMsg};
  for(let i=0;i<urls.length;i+=4){
    await Promise.all(urls.slice(i,i+4).map(async u=>{
      try{if(await c.match(u)){ok++;return}let r;try{r=await fetch(u,{mode:'cors'})}catch(x){r=await fetch(u,{mode:'no-cors'})}
        if(r&&(r.ok||r.type==='opaque')){await c.put(u,r);ok++}else fail++}catch(x){fail++}
    }));set();
  }
  UI.cacheMsg=fail?`Done: ${ok} cached, ${fail} failed (check connection).`:`All ${ok} ${kind==='gif'?'animations':'images'} cached for offline.`;
  const el=$('#cachemsg');if(el)el.textContent=UI.cacheMsg;toast(UI.cacheMsg,3500);
}
function validRoutine(a){
  return Array.isArray(a)&&a.length>0&&a.every(e=>e&&typeof e==='object'&&e.day!=null&&e.id!=null&&e.name&&e.order!=null&&e.sets!=null&&e.reps!=null);
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const tab=ev.target.closest('[data-tab]');
  if(tab){UI.tab=tab.dataset.tab;lsSet('gc.tab',UI.tab);render();window.scrollTo(0,0);return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='ov-close'){if(ev.target===el){closeModal();UI.snooze=Date.now()+30*60000}return}
  if(a==='remind-time')return;
  switch(a){
    case'day':UI.day=+el.dataset.day;render();window.scrollTo(0,0);break;
    case'toggle':{const k=el.dataset.key;const [d,id]=k.split(':');const dd=dayObj(+d);const cur=UI.open[k]!==undefined?UI.open[k]:(firstIncomplete(dd)===id);UI.open[k]=!cur;render();break}
    case'play':{UI.gif[el.dataset.key]=!UI.gif[el.dataset.key];render();break}
    case'wstep':{const inp=el.parentElement.querySelector('input');const cur=num(inp.value)||0;const v=Math.max(0,r2(cur+ +el.dataset.d));inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));break}
    case'fin':finishSet(el);break;
    case'undo':{const id=el.dataset.id,i=+el.dataset.i,day=UI.day;const l=getSet(day,id,i);if(l){UI.draft[day+':'+id+':'+i]={w:l.w==null?'':String(l.w),r:String(l.r),r2:l.r2==null?'':String(l.r2)};const s=sess(day);s.sets[id][i]=null;s.done=false;save();render()}break}
    case'copy':{const id=el.dataset.id,i=+el.dataset.i,day=UI.day;const e=exOf(day,id);const ref=refFor(day,e,i);if(ref){UI.draft[day+':'+id+':'+i]={w:ref.w==null?'':String(ref.w),r:String(ref.r),r2:ref.r2==null?'':String(ref.r2)};render()}break}
    case'finish-workout':{const s=sess(UI.day,true);s.done=true;s.t=Date.now();stopRest();save();render();toast('Workout saved');break}
    case'notif-enable':{S.settings.notifyAsked=true;save();if('Notification' in window)Notification.requestPermission().then(p=>{render();toast(p==='granted'?'Alerts enabled':'Alerts not enabled')});break}
    case'dose-open':openDoseModal();break;
    case'dose-chip':{$('#dm').value=el.dataset.v;$$('[data-act="dose-chip"]').forEach(b=>b.classList.toggle('primary',b===el));break}
    case'dose-toggle':{UI.injected=!UI.injected;el.textContent=(UI.injected?'☑':'☐')+' Ozempic dose injected';el.classList.toggle('primary',UI.injected);break}
    case'dose-save':saveDose();break;
    case'dose-later':closeModal();UI.snooze=Date.now()+30*60000;break;
    case'dose-del':{if(confirm('Delete this dose entry?')){S.doses=S.doses.filter(d=>String(d.t)!==el.dataset.t);save();render()}break}
    case'w-save':{const kg=num($('#wq').value);if(kg==null||kg<30||kg>400){toast('Enter a valid weight in kg');break}const t=dkey();S.weights=S.weights.filter(w=>w.date!==t);S.weights.push({date:t,kg:r1(kg)});save();render();toast('Weight saved');break}
    case'w-del':{if(confirm('Delete this weigh-in?')){S.weights=S.weights.filter(w=>w.date!==el.dataset.date);save();render()}break}
    case'meal':{const t=dkey();const m=S.meals[t]||(S.meals[t]={});m[el.dataset.id]=!m[el.dataset.id];save();render();break}
    case'ing':UI.ing[el.dataset.id]=!UI.ing[el.dataset.id];render();break;
    case'water':{const t=dkey();S.water[t]=Math.max(0,(S.water[t]||0)+ +el.dataset.ml);save();render();buzz(15);break}
    case'tgl':{const k=el.dataset.k;S.settings[k]=!S.settings[k];if(k==='wake'&&S.settings.wake)wake();save();render();break}
    case'export':{const out=Object.assign({app:'gym-companion',exportedAt:new Date().toISOString()},S);download(`gym-companion-backup-${dkey()}.json`,JSON.stringify(out,null,1),'application/json');toast('Backup downloaded');break}
    case'import':pickFile(txt=>{try{const o=JSON.parse(txt);if(!o||typeof o!=='object'||typeof o.sessions!=='object'||!Array.isArray(o.weights))throw 0;
      if(!confirm('Replace ALL current data with this backup?'))return;delete o.app;delete o.exportedAt;S=Object.assign(def(),o);S.settings=Object.assign(def().settings,o.settings||{});_dc=null;save();UI.day=suggestedDay();render();toast('Backup restored')}catch(x){toast('That file is not a Gym Companion backup')}});break;
    case'routine-import':pickFile(txt=>{try{const o=JSON.parse(txt);if(!validRoutine(o))throw 0;S.routine=o;_dc=null;save();UI.day=suggestedDay();render();toast(`Routine imported (${o.length} rows)`)}catch(x){toast('Not a valid routine.json')}});break;
    case'routine-reset':if(confirm('Switch back to the built-in routine? Your logs are kept.')){S.routine=null;_dc=null;save();UI.day=suggestedDay();render()}break;
    case'ics':download('gym-companion-tuesday.ics',makeICS(),'text/calendar');toast('Open the file to add it to your calendar');break;
    case'cache':cacheMedia(el.dataset.kind);break;
    case'install':if(UI.installEvt){UI.installEvt.prompt();UI.installEvt=null;render()}break;
    case'rest-adj':adjRest(+el.dataset.s);break;
    case'rest-skip':stopRest();break;
  }
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('[role="checkbox"],[role="switch"]')){ev.preventDefault();ev.target.click()}});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.f){const row=t.closest('.set');if(row){const k=UI.day+':'+row.dataset.id+':'+row.dataset.i;const d=UI.draft[k]||(UI.draft[k]={w:'',r:'',r2:''});
    ['w','r','r2'].forEach(f=>{const el=row.querySelector(`[data-f="${f}"]`);if(el)d[f]=el.value})}}
  else if(t.dataset&&t.dataset.note){S.notes[t.dataset.note]=t.value;save()}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.act==='remind-time'&&t.value){S.settings.remindTime=t.value;save()}});
document.addEventListener('toggle',ev=>{const t=ev.target;if(t.tagName==='DETAILS'&&t.dataset.key)UI.instr[t.dataset.key]=t.open},true);
document.addEventListener('error',ev=>{
  const t=ev.target;if(!(t&&t.tagName==='IMG'&&t.dataset.img))return;
  if(t.hasAttribute('crossorigin')){t.removeAttribute('crossorigin');t.src=t.src}
  else{t.style.visibility='hidden'}
},true);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();UI.installEvt=e;if(UI.tab==='data')render()});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){wake();if(T.end&&!T.fired)tick();const keep=document.activeElement&&document.activeElement.tagName==='INPUT';if(!keep&&!UI.modalOpen)render();maybeTuesday()}
  else flush();
});
window.addEventListener('pagehide',flush);

function maybeTuesday(){if(!UI.modalOpen&&tuesdayPending()&&Date.now()>UI.snooze)openDoseModal()}

/* ---------- service worker ---------- */
async function initSW(){
  if(!('serviceWorker' in navigator)){UI.swState='not supported';return}
  try{
    const reg=await navigator.serviceWorker.register('sw.js');UI.swState=navigator.serviceWorker.controller?'active':'installing…';
    navigator.serviceWorker.ready.then(()=>{UI.swState='active';if(UI.tab==='data')render()});
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('Update ready — reload the app to apply',6000)})});
  }catch(e){UI.swState='unavailable (needs https)'}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}

/* ---------- boot ---------- */
(async function boot(){
  await load();
  UI.day=suggestedDay();
  if(!VIEWS[UI.tab])UI.tab='workout';
  render();restoreRest();initSW();maybeTuesday();
  window.__gc={get S(){return S},UI,render,days,pace,makeICS};
})();
})();
</script>
